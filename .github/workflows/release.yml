# Release: every push to master builds kdc for Linux + Windows and
# creates/updates the GitHub Release for the Cargo.toml version.
# No binaries are ever committed, no manual tagging needed.
#
#   git push origin master
#   → prep (read version) → linux + windows builds → Release vX.Y.Z
#      with kdc-linux-amd64 + kdc-windows-x86_64-vX.Y.Z.zip
#
# New version = bump `version` in Cargo.toml and push. Re pushing the
# same version just refreshes that release's assets (tag is moved to
# the latest commit). Manual re-run: Actions → release → Run workflow.

name: release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          VER="$(grep '^version' Cargo.toml | head -n 1 | cut -d'"' -f2)"
          [ -n "$VER" ] || { echo "no version in Cargo.toml"; exit 1; }
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

  linux:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Offline tests (unit + CLI, no node)
        run: |
          cargo test --locked --lib 2>&1 | tail -n 1
          cargo test --locked --test cli 2>&1 | tail -n 1
      - name: Build release binary
        run: cargo build --locked --release
      - name: Stage asset
        run: |
          mkdir -p dist
          cp target/release/kdc dist/kdc-linux-amd64
          chmod +x dist/kdc-linux-amd64
          ./dist/kdc-linux-amd64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: kdc-linux-amd64
          path: dist/kdc-linux-amd64

  windows:
    needs: prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-xwin
        run: cargo install cargo-xwin
      - name: Build Windows x86_64 (MSVC, rustls — no OpenSSL)
        run: cargo xwin build --locked --release --target x86_64-pc-windows-msvc
      - name: Stage zip (kdc.exe + README.md)
        run: |
          VER="${{ needs.prep.outputs.version }}"
          DIST="kdc-windows-x86_64-v$VER"
          rm -rf "$DIST" "$DIST.zip"
          mkdir -p "$DIST"
          cp target/x86_64-pc-windows-msvc/release/kdc.exe "$DIST/"
          cp README.md "$DIST/"
          (cd "$DIST" && sha256sum kdc.exe README.md > SHA256SUMS.txt)
          zip -r -q "$DIST.zip" "$DIST"
          ls -la "$DIST.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kdc-windows-zip
          path: kdc-windows-x86_64-*.zip

  release:
    needs: [prep, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move version tag to this commit
        run: |
          git tag -f "${{ needs.prep.outputs.tag }}"
          git push -f origin "${{ needs.prep.outputs.tag }}"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep.outputs.tag }}
          files: |
            dist/kdc-linux-amd64/kdc-linux-amd64
            dist/kdc-windows-zip/kdc-windows-x86_64-*.zip
          generate_release_notes: true
